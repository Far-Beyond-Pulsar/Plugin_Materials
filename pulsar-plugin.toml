# The `pulsar.materials` plugin's descriptor. A project enables or disables it in
# its Pulsar.toml (`[plugins]`); disabled, its kind is absent (see
# crates/core/pulsar_plugins). Its root crate carries this file
# (`pulsar_plugins::installed!`).
id = "pulsar.materials"
name = "Materials"
description = "Materials: the material row and texture table every kind draws with, the PBR evaluation and the Radiant material templates"
enabled_by_default = true
provides = [
    { id = "pulsar.materials.table", kind = "buffer", members = ["materials"], version = 1 },
    { id = "pulsar.materials.api", kind = "api", members = ["helio-mats", "helio-pass-materials", "materials_component"], version = 1 },
]
requires = []

# The plugin's root crate (the package in this directory): the one place it
# registers everything it contributes. A game links it without its `editor`
# feature; the editor links it with.
root = "materials_plugin"
