[package]
name = "materials_component"
version = "0.1.0"
edition = "2024"
description = "Materials (pulsar.materials): the material assets (loader and reloads), the material graph compiler and the plugin's Helio feature set (the material texture table and its sampler); the root crate registers them"

# The plugin's root crate (`materials_plugin`) links it and registers what it
# defines; this crate registers nothing.
[lib]
name = "materials_component"

[dependencies]
# The preview program (`preview_program`): its pipeline, error scope and
# preview textures.
image = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
pollster = "=0.4.0"
engine_state = { workspace = true }
# Texture references in graphs resolve through the project's file index.
engine_fs = { workspace = true }
pulsar_reflection = { workspace = true }
wgpu = { workspace = true }
helio = { workspace = true }
helio-feature-api = { workspace = true }
helio-mats = { workspace = true }
helio-pass-materials = { workspace = true }
# The material assets: asset sources, texture residency and cooking (images
# are core).
helio_component = { workspace = true }
pulsar_scenedb = { workspace = true }
# The material graph compiler.
psgc = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
