[package]
name = "materials_plugin"
version = "0.1.0"
edition = "2024"
publish = false
description = "Materials (`pulsar.materials`): the plugin's root crate, the one place it registers everything it contributes (runtime registrations always, the editor's with `editor`)"
autoexamples = false

[features]
# The editor's registration (the material graph editor's provider) and the
# crates it needs. A game links the root without it, so it takes no editor
# dependency.
editor = ["dep:materials_editor", "dep:plugin_manager"]

[dependencies]
# Image and material files changed on disk are asset updates (`engine_fs::AssetChangeKind`).
engine_fs = { workspace = true }
ui_types_common = { workspace = true }
# The plugin gate and the registrations' collection.
pulsar_plugins = { workspace = true }
inventory = { workspace = true }
# The plugin's crates. The material instances (`helio_mats::instance`) are the
# api's types; their SceneDB attachments are registered here (an api crate
# holds no registration).
materials_component = { workspace = true }
materials_editor = { workspace = true, optional = true }
helio-mats = { workspace = true, features = ["instances"] }
# The engine seams the plugin registers into.
engine_backend = { path = "../../../crates/core/engine_backend", default-features = false, features = ["render"] }
helio_component = { workspace = true }
plugin_editor_api = { workspace = true }
pulsar_scenedb = { workspace = true }
# The editor's extension points.
plugin_manager = { workspace = true, optional = true }

[dev-dependencies]
# The plugin's integration tests (`tests/`): the plugin as a game links it.
# The meshes draw with material instances; their root registers the mesh
# class a level decodes.
meshes_component = { workspace = true }
meshes_plugin = { workspace = true }
engine_state = { workspace = true }
pulsar_world_registry = { workspace = true }
psgc = { workspace = true }
wgpu = { workspace = true }
pollster = "=0.4.0"
image = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
